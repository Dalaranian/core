spring:
  application:
    name: core

  # 기본 실행 프로파일은 dev. STG/PROD 배포 시 SPRING_PROFILES_ACTIVE(또는 spring.profiles.active)로 덮어쓴다.
  profiles:
    active: dev

logging:
  pattern:
    # 발생 시점 타임스탬프 + 요청 traceId를 prefix로, 요청 외 로그는 traceId=- 로 표기
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} traceId=%X{traceId:-} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} traceId=%X{traceId:-} [%thread] %-5level %logger{36} - %msg%n"

# 회원 탈퇴 설정. grace-days=1 이면 "탈퇴 신청일 익일 자정"에 삭제 배치가 데이터를 제거한다.
user:
  withdrawal:
    grace-days: 1
    delete-cron: "0 0 0 * * *"

# 액추에이터: 익명 노출이 안전한 health, info만 웹으로 노출한다.
# metrics/env 등은 URI 통계·프로퍼티가 드러나므로 운영에서 인증 뒤에 별도 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # DB 등 컴포넌트 상태까지 헬스체크로 확인
      show-details: always